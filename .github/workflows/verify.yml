name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Source launch, tests and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - run: npm run start:check
      - run: npm run build
      - run: npm run jobcheck
      - if: runner.os == 'Windows'
        run: uv run --cache-dir .cache/uv --frozen python -m tools.package_windows
      - if: runner.os == 'Windows'
        run: npm run packagecheck:windows
